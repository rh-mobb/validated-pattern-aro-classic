# Offline chart validation only. No cluster lookup or real cloud resource IDs.
initialWorkerPool: worker
machineSets:
  - metadata:
      name: fixture-worker-zone1
      labels:
        machine.openshift.io/cluster-api-cluster: fixture
    spec:
      replicas: 1
      selector:
        matchLabels:
          machine.openshift.io/cluster-api-machineset: fixture-worker-zone1
      template:
        metadata:
          labels:
            machine.openshift.io/cluster-api-machineset: fixture-worker-zone1
        spec:
          metadata:
            labels:
              workload: general
          providerSpec:
            value:
              apiVersion: machine.openshift.io/v1beta1
              kind: AzureMachineProviderSpec
              location: eastus
              zone: "1"
              vmSize: Standard_D4s_v5
              osDisk:
                diskSizeGB: 128
                osType: Linux
                managedDisk:
                  storageAccountType: Premium_LRS
              image:
                resourceID: fixture-image
              credentialsSecret:
                name: azure-cloud-credentials
              userDataSecret:
                name: worker-user-data
